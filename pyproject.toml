[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "dropbrief"
version = "0.1.0"
description = "Collect registered model-release metadata, compare selected config fields, and read cached or offline release brief snapshots."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "SuperMarioYL" }]
homepage = "https://github.com/SuperMarioYL/dropbrief"
repository = "https://github.com/SuperMarioYL/dropbrief"
keywords = [
  "llm",
  "qwen",
  "glm",
  "deepseek",
  "kimi",
  "model-release",
  "cli",
  "xinchuang",
  "airgap",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: System :: Installation/Setup",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.scripts]
dropbrief = "dropbrief.cli:app"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/dropbrief"
Issues = "https://github.com/SuperMarioYL/dropbrief/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dropbrief"]

[tool.hatch.build.targets.wheel.force-include]
"docs/model-families.yaml" = "dropbrief/data/model-families.yaml"

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "snapshots", "examples", "README.md", "README.en.md", "LICENSE", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
