<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="dropbrief 架构：CLI→Fetch→ArchDiff→Briefing，气隙 Snapshot 离线分支">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>
  <text x="440" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#A1A1A8">单进程 · 单 uvx 入口 · 15min 缓存 · 气隙零出站</text>

  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="200" y1="150" x2="240" y2="150" marker-end="url(#ah-d)"/>
    <line x1="420" y1="150" x2="460" y2="150" marker-end="url(#ah-d)"/>
    <line x1="640" y1="150" x2="680" y2="150" marker-end="url(#ah-d)"/>
    <line x1="770" y1="250" x2="770" y2="192" marker-end="url(#ah-d)"/>
  </g>
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="200" y1="150" x2="236" y2="150" stroke="#4DA3FF" stroke-opacity="0.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="420" y1="150" x2="456" y2="150" stroke="#8985FF" stroke-opacity="0.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="150" x2="676" y2="150" stroke="#2DC79A" stroke-opacity="0.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.0s" repeatCount="indefinite"/>
    </line>
    <line x1="770" y1="246" x2="770" y2="192" stroke="#2DC79A" stroke-opacity="0.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.4s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M200,150 L236,150" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M420,150 L456,150" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M640,150 L676,150" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="20" y="110" width="180" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="110" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#D6EAFF">CLI · typer</text>
    <text x="110" y="166" text-anchor="middle" font-size="11" fill="#A1A1A8">status / diff / brief</text>

    <rect x="240" y="110" width="180" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#E5E4FF">Fetch · 15min 缓存</text>
    <text x="330" y="166" text-anchor="middle" font-size="11" fill="#A1A1A8">HF · ModelScope · reddit</text>

    <rect x="460" y="110" width="180" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="550" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#E5E4FF">ArchDiff</text>
    <text x="550" y="166" text-anchor="middle" font-size="11" fill="#A1A1A8">config.json Δ vs prior</text>

    <rect x="680" y="110" width="180" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="770" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#D6F4EA">Briefing</text>
    <text x="770" y="166" text-anchor="middle" font-size="11" fill="#A1A1A8">一屏决策简报 · worth-switch</text>

    <rect x="680" y="250" width="180" height="70" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5"/>
    <text x="770" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#D6F4EA">Snapshot · 气隙</text>
    <text x="770" y="302" text-anchor="middle" font-size="11" fill="#A1A1A8">--offline · 零出站</text>
  </g>
</svg>
