<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="dropbrief 架构：CLI→Fetch→ArchDiff→Briefing，气隙 Snapshot 离线分支">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>
  <text x="440" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#6E6E73">单进程 · 单 uvx 入口 · 15min 缓存 · 气隙零出站</text>

  <!-- static base connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="200" y1="150" x2="240" y2="150" marker-end="url(#ah-l)"/>
    <line x1="420" y1="150" x2="460" y2="150" marker-end="url(#ah-l)"/>
    <line x1="640" y1="150" x2="680" y2="150" marker-end="url(#ah-l)"/>
    <line x1="770" y1="250" x2="770" y2="192" marker-end="url(#ah-l)"/>
  </g>
  <!-- marching-dash data flow (dasharray period 16; from 32→0 = 2 periods → seamless) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="200" y1="150" x2="236" y2="150" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="420" y1="150" x2="456" y2="150" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="150" x2="676" y2="150" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.0s" repeatCount="indefinite"/>
    </line>
    <line x1="770" y1="246" x2="770" y2="192" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.4s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- packet dots along the horizontal flow -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M200,150 L236,150" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M420,150 L456,150" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M640,150 L676,150" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes -->
  <g>
    <rect x="20" y="110" width="180" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="110" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">CLI · typer</text>
    <text x="110" y="166" text-anchor="middle" font-size="11" fill="#6E6E73">status / diff / brief</text>

    <rect x="240" y="110" width="180" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">Fetch · 15min 缓存</text>
    <text x="330" y="166" text-anchor="middle" font-size="11" fill="#6E6E73">HF · ModelScope · reddit</text>

    <rect x="460" y="110" width="180" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="550" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">ArchDiff</text>
    <text x="550" y="166" text-anchor="middle" font-size="11" fill="#6E6E73">config.json Δ vs prior</text>

    <rect x="680" y="110" width="180" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="770" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">Briefing</text>
    <text x="770" y="166" text-anchor="middle" font-size="11" fill="#6E6E73">一屏决策简报 · worth-switch</text>

    <rect x="680" y="250" width="180" height="70" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5"/>
    <text x="770" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Snapshot · 气隙</text>
    <text x="770" y="302" text-anchor="middle" font-size="11" fill="#6E6E73">--offline · 零出站</text>
  </g>
</svg>
